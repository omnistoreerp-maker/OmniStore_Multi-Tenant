<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز التعليم — OmniStore ERP</title>
  <meta name="theme-color" content="#f8fbff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/digitronics-icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="platform/platform.css">
  <style>
    :root { --radius: 14px; --brand: #6366f1; --brand2: #8b5cf6; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f8fbff 0%, #edf5ff 45%, #eef2ff 100%);
      color: #0f172a; min-height: 100vh; margin: 0;
      padding: calc(16px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .container { max-width: 1080px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .page-header h1 { margin: 0; font-size: 1.25rem; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: rgba(15,23,42,.06); color: #0f172a; text-decoration: none; font-weight: 700; font-size: 13px; }
    .card { background: rgba(255,255,255,.8); border: 1px solid rgba(15,23,42,.08); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(15,23,42,.08); padding: 16px; margin-bottom: 14px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .stat { background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.18); border-radius: 12px; padding: 12px; }
    .stat .v { font-size: 1.4rem; font-weight: 800; }
    .stat .l { font-size: 12px; color: #475569; margin-top: 2px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(15,23,42,.12); background: rgba(255,255,255,.7); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab[aria-selected="true"] { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; border-color: transparent; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid rgba(15,23,42,.14); border-radius: 10px; font: inherit; font-size: 13px; background: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 0; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
    .btn-outline { background: rgba(15,23,42,.05); color: #0f172a; border: 1px solid rgba(15,23,42,.12); }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid rgba(15,23,42,.06); }
    th { color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; }
    .s-active, .s-published { background: rgba(16,185,129,.12); color: #047857; }
    .s-draft, .s-inactive { background: rgba(245,158,11,.14); color: #b45309; }
    .s-archived, .s-cancelled { background: rgba(100,116,139,.14); color: #334155; }
    .s-completed { background: rgba(59,130,246,.12); color: #1d4ed8; }
    .state { text-align: center; color: #64748b; padding: 20px; font-size: 13px; }
    .state.error { color: #b91c1c; }
    .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #eef2f7 25%, #e2e8f0 37%, #eef2f7 63%); background-size: 400% 100%; animation: sk 1.3s infinite; }
    @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .toast { position: fixed; bottom: 18px; inset-inline: 18px; padding: 12px 14px; border-radius: 12px; background: #0f172a; color: #f8fafc; font-size: 14px; font-weight: 600; z-index: 9999; }
    .toast.error { background: #7f1d1d; }
    .hidden { display: none !important; }
    @media (max-width: 640px) { th, td { padding: 6px 8px; font-size: 12px; } .page-header h1 { font-size: 1.05rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>مركز التعليم</h1>
      <div class="toolbar">
        <a class="back-link" href="business.html">إدارة الأعمال</a>
        <a class="back-link" href="platform.html">الصفحة الرئيسية</a>
      </div>
    </div>

    <div id="edu-auth-note" class="card state hidden">يلزم تسجيل الدخول للوصول إلى مركز التعليم.</div>

    <section class="card" aria-label="ملخص">
      <div id="edu-stats" class="stats"></div>
    </section>

    <nav class="tabs" id="edu-tabs" role="tablist" aria-label="الأقسام"></nav>

    <section class="card">
      <div class="toolbar" id="edu-toolbar"></div>
      <div id="edu-content"><div class="state">جارٍ التحميل…</div></div>
    </section>
  </div>
  <script src="platform/education.js"></script>
</body>
</html>
