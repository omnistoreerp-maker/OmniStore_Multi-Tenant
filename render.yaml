# Render blueprint — DigiTronics/OmniStore ERP
# One web service runs BOTH the Express API and the static frontend
# (backend/server.js serves /api/v1/* and the repo-root frontend tree).
# Usage: connect the GitHub repo in Render, create a Blueprint from this
# file, then set JWT_SECRET in the service's environment (sync: false).
services:
  - type: web
    name: omnistore-erp
    runtime: node
    plan: free
    # marketplace/index.html (the entry served at /marketplace/) references
    # ./dist/* assets that only exist after the Vite build. dist/ is gitignored,
    # so without this step production served the HTML with 404 assets and a
    # blank page. build:marketplace installs and builds it; no new deps.
    buildCommand: npm install && npm run build:marketplace
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # REQUIRED — set a long random value in the Render dashboard
      # (sync: false keeps it out of this file).
      - key: JWT_SECRET
        sync: false
      - key: AUTH_REQUIRED
        value: "false"
      # Tenant / multi-company features (Phase F user management needs them)
      - key: ENABLE_MULTI_COMPANY_LOGIN
        value: "true"
      - key: ENABLE_TENANT_ROLES
        value: "true"
      - key: ENABLE_TENANT_CARRY
        value: "true"
      - key: ENABLE_TENANT_USER_MEMBERSHIP
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: BODY_LIMIT
        value: 10mb
    disk:
      name: omnistore-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
