# Render blueprint — OmniStore ERP
services:
  - type: web
    name: omnistore-erp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: AUTH_REQUIRED
        value: "false"
