# Render blueprint — OmniStore ERP
services:
  - type: web
    name: omnistore-erp
    env: docker
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: AUTH_REQUIRED
        value: "false"
      - key: ENABLE_MULTI_COMPANY_LOGIN
        value: "true"
      - key: ENABLE_TENANT_ROLES
        value: "true"
      - key: ENABLE_TENANT_CARRY
        value: "true"
      - key: ENABLE_TENANT_USER_MEMBERSHIP
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: BODY_LIMIT
        value: "10mb"
    # disk: removed for free tier compatibility
