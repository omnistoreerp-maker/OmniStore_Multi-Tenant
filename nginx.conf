# DigiTronics — production nginx
# Reverse proxy for the backend API + static hosting for the frontend.
# Used by docker-compose.yml (profile "nginx"):
#   docker compose --profile nginx up -d

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    image/svg+xml;

  upstream digitronics_backend {
    server backend:3001;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to all responses; location blocks below
    # deliberately avoid their own add_header so these are inherited).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # Static frontend with cache headers (expires adds Cache-Control
    # without overriding the security headers above).
    location / {
      try_files $uri $uri/ /index.html;
      expires 1h;
    }

    # Health forwarding (unauthenticated, used by compose/orchestrators).
    location = /api/v1/health {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # Backend API reverse proxy.
    location /api/ {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # API responses must never be cached by intermediaries.
      expires off;
    }

    # nginx's own liveness endpoint.
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
