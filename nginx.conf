# DigiTronics — production nginx
# Reverse proxy for the backend API + static hosting for the frontend.
# Used by docker-compose.yml (profile "nginx"):
#   docker compose --profile nginx up -d

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    image/svg+xml;

  upstream digitronics_backend {
    server backend:3001;
    keepalive 32;
  }

  # The online-games player frame runs on its OWN origin, never on this one:
  # the section's whole security story is that the games cannot see the
  # platform's cookies, storage or tenant data, and a same-origin frame would
  # see all three. That makes the origin OWNER CONFIGURATION — it is written
  # here per deployed host and is never invented, the same rule CORS_ORIGINS
  # follows in .env (empty means "not configured", not "guess something").
  #
  # `default ""` keeps the shipped config byte-equivalent to the TikTok-only
  # policy it had before this section existed: an unset host adds nothing to
  # frame-src, so deploying without a games origin is a no-op rather than a
  # broken header.
  map $host $omnistore_games_origin {
    default "";
    # One line per host, bare origin only (no path, no trailing slash):
    #   example.com https://games.example.com;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to all responses; location blocks below
    # deliberately avoid their own add_header so these are inherited).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP must mirror backend/server.js. frame-src allows the official TikTok
    # Embed Player origin (https://www.tiktok.com/player/v1/...) used by
    # reels.html, plus — and only when it has been configured in the
    # $omnistore_games_origin map above — the origin serving the online-games
    # player frame. 'self' is intentionally NOT re-added, so same-origin frames
    # stay blocked; the games are cross-origin by design and the map entry is
    # what makes that possible without opening the directive up. img-src keeps
    # 'self' and data: and adds TikTok's two CDN domains, because the Display
    # API serves cover_image_url from rotating "pNN-sign" hosts (documented:
    # https://p16-sign.tiktokcdn-us.com/...). These are scoped subdomain matches
    # on TikTok-owned domains, never `*`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tiktokcdn.com https://*.tiktokcdn-us.com; connect-src 'self'; frame-src https://www.tiktok.com $omnistore_games_origin" always;

    # Static frontend with cache headers (expires adds Cache-Control
    # without overriding the security headers above).
    location / {
      try_files $uri $uri/ /index.html;
      expires 1h;
    }

    # Health forwarding (unauthenticated, used by compose/orchestrators).
    location = /api/v1/health {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # Backend API reverse proxy.
    location /api/ {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # API responses must never be cached by intermediaries.
      expires off;
    }

    # nginx's own liveness endpoint.
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
