# DigiTronics — production nginx
# Reverse proxy for the backend API + static hosting for the frontend.
# Used by docker-compose.yml (profile "nginx"):
#   docker compose --profile nginx up -d

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    image/svg+xml;

  upstream digitronics_backend {
    server backend:3001;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to all responses; location blocks below
    # deliberately avoid their own add_header so these are inherited).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP must mirror backend/server.js exactly. frame-src allows ONLY the
    # official TikTok Embed Player origin (https://www.tiktok.com/player/v1/...)
    # used by reels.html — 'self' is intentionally NOT re-added, so same-origin
    # frames stay blocked. img-src keeps 'self' and data: and adds TikTok's two
    # CDN domains, because the Display API serves cover_image_url from rotating
    # "pNN-sign" hosts (documented: https://p16-sign.tiktokcdn-us.com/...).
    # These are scoped subdomain matches on TikTok-owned domains, never `*`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tiktokcdn.com https://*.tiktokcdn-us.com; connect-src 'self'; frame-src 'self' https://www.tiktok.com" always;

    # Static frontend with cache headers (expires adds Cache-Control
    # without overriding the security headers above).
    location / {
      try_files $uri $uri/ /index.html;
      expires 1h;
    }

    # Online Games (portal cycle): first-party game builds under /games/ are
    # consumed inside the portal's SANDBOXED player iframe (opaque origin — the
    # player deliberately omits allow-same-origin). A CSP on these documents
    # is evaluated against that opaque origin, so 'self' matches nothing and
    # each game's own first-party subresources (css/js/fonts/images) would be
    # blocked, rendering vendored games blank. The security boundary for games
    # is the iframe sandbox itself (no same-origin access, no top navigation),
    # pinned by the portal tests — not a per-document CSP. This location
    # re-declares the keep-set of headers (any add_header in a location
    # suppresses inheritance of the server-level set) and swaps X-Frame-Options
    # to SAMEORIGIN so the SAME-ORIGIN portal player can embed game pages while
    # every cross-origin embedder stays blocked. backend/server.js mirrors this
    # by stripping the origin-relative headers on /games/*.
    location ^~ /games/ {
      try_files $uri =404;
      expires 1h;
      # Never answer a conditional request for game builds: a bodyless 304 can
      # leave an opaque-origin (sandboxed) player frame without a usable body
      # for its own css/js, so the game boots unstyled and dead. `etag off`
      # removes the validator and `if_modified_since off` makes nginx ignore
      # If-Modified-Since, so every game asset is served as a full 200.
      etag off;
      if_modified_since off;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Health forwarding (unauthenticated, used by compose/orchestrators).
    location = /api/v1/health {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # Backend API reverse proxy.
    location /api/ {
      proxy_pass http://digitronics_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # API responses must never be cached by intermediaries.
      expires off;
    }

    # nginx's own liveness endpoint.
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
