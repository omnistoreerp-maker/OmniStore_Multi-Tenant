name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to main meant a
  # stacked PR (one feature branch based on another) got no checks at all, so
  # a change could sit in review with no CI signal.
  pull_request:

jobs:
  backend:
    name: Backend (node --check, jest, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          node --check server.js
          dirs=""
          for d in config controllers middleware models routes services utils scripts; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          find $dirs -name '*.js' -exec node --check {} +

      # The Education page ships a source-contract suite (route parity, write
      # parity, vocabulary, i18n, workspace reachability) that needs no server,
      # browser or network. It runs natively with Node (no Jest), so we invoke it
      # via the test:edu npm script rather than hard-coding a path; a contract
      # break fails the build.
      - name: Education frontend contract (81 checks, test:edu)
        run: npm run test:edu

      - name: Unit tests (fail on failure)
        run: npm test

      - name: Coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Linux + Node 20: the POSIX permission assertions (artifact modes, chmod,
  # umask) only mean anything on a POSIX filesystem, and Node 20 is the oldest
  # supported line (better-sqlite3 12 declares 20.x+). This job reuses the
  # backend test command; it adds no dependencies, coverage upload or gates.
  backend-posix-node20:
    name: Backend POSIX permissions (Linux, Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Backup/restore and SQLite suites (Node 20)
        run: npm test -- tests/backupRestore tests/backupJob tests/restoreIsolation tests/tokenStore.backup tests/challengeStore.sqlite

      # The POSIX-only cases must run here, not be skipped: a silent skip would
      # leave the security property untested on the platform that deploys. Only
      # the four POSIX titles are checked, because the Windows-only case in the
      # same file is legitimately skipped on Linux.
      - name: POSIX permission assertions are not skipped
        run: |
          npm test -- tests/backupRestore.permissions --verbose 2>&1 | tee /tmp/permissions.log
          if grep -E "skipped .*(0600 source|source mode in the manifest|re-applies 0o600|each entry its own mode)" /tmp/permissions.log; then
            echo "POSIX permission assertions were skipped on Linux"
            exit 1
          fi

      # Same rule for the unified backup job and restore isolation: their POSIX
      # mode, umask and mount-identity assertions ARE the security property, so a
      # silent skip on the platform that deploys must fail the job.
      - name: Backup-job and isolation POSIX assertions are not skipped
        run: |
          npm test -- tests/backupJob tests/restoreIsolation --verbose 2>&1 | tee /tmp/backupjob.log
          if grep -E "skipped .*(backup directory is 0700|status directory is 0700|insufficient destination permissions)" /tmp/backupjob.log; then
            echo "POSIX backup-job assertions were skipped on Linux"
            exit 1
          fi

  e2e:
    name: Playwright regression (index.html, DigiTronics_v5.html, education assignments)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/e2e/package-lock.json
            backend/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright — OmniStore landing page (fail on failure)
        working-directory: .
        run: node tests/e2e/landing-browser-verify.cjs

      # verify-education-assignments.js boots the real Express app from
      # backend/server.js, so the backend runtime dependencies must exist.
      # The suite seeds a throwaway temp directory and never reads or writes
      # backend/data; nothing is mocked and no production data is used.
      - name: Install backend runtime dependencies (education E2E boots the real app)
        working-directory: backend
        run: npm ci

      - name: Playwright — index.html (fail on failure)
        run: node verify.js index.html 18940

      - name: Playwright — DigiTronics_v5.html (fail on failure)
        run: node verify.js DigiTronics_v5.html 18941

      - name: Playwright — education student assignments (real backend, fail on failure)
        run: node verify-education-assignments.js

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  marketplace:
    name: Marketplace (tsc, vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build

      # The tracked marketplace/index.html is the PRODUCTION entry served at
      # GET /marketplace/. Fail the build if it references any ./dist asset that
      # the fresh build did not emit (the 200 HTML + 404 JS/CSS blank-page class).
      - name: Entry references only emitted assets
        run: node scripts/verify-entry-assets.mjs

  # License / dependency gate for the Online Games roster. Pure node + git:
  # no install step, so a compromised or half-installed dependency tree can
  # never make this gate pass by accident. Fails the build if a blocked game
  # (survivors, holdtheline, snakesurvivors), a blocked asset byte-hash or an
  # unlicensed Ellaz UI font ever enters the tree.
  online-games-gate:
    name: Online Games license/dependency gate (46 SAFE / 3 BLOCKED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Roster + licence + vendoring-scope gate
        run: node online-games/roster-gate.test.cjs

      # Search, roster contract, the shipped pages, the sandbox/CSP and the
      # no-network promise of the frame. Pure node — no install step either.
      # The checks that need `runtime/dist/` skip here (it is gitignored) and
      # run in full in the online-games-runtime job below, which builds it.
      - name: Section tests (roster, search, surface, runtime)
        run: >
          node --test
          online-games/tests/roster.test.cjs
          online-games/tests/search.test.cjs
          online-games/tests/surface.test.cjs
          online-games/tests/runtime.test.cjs

  # The frame the games origin serves: typecheck it, build it, then run the
  # section tests again with `dist/` on disk so the emitted document, its CSP
  # and its network surface are actually inspected rather than skipped.
  online-games-runtime:
    name: Online Games runtime (tsc, vite build, dist tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online-games/runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: online-games/runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build

      - name: Section tests with dist/ present
        run: >
          node --test
          ../tests/roster.test.cjs
          ../tests/search.test.cjs
          ../tests/surface.test.cjs
          ../tests/runtime.test.cjs

  # Verify Node 24 Docker image build and runtime on GitHub-hosted runners
  docker-node24-verification:
    name: Docker Node 24 verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Node 24 Docker image
        run: |
          docker build -f Dockerfile -t omnistore-node24-ci:${{ github.sha }} .
          # Fail immediately on build failure - no continue-on-error

      - name: Verify Node 24 runtime in image
        run: |
          RESULT=$(docker run --rm --entrypoint node omnistore-node24-ci:${{ github.sha }} --version) || exit 1
          echo "Node version: $RESULT"
          # Assert Node 24.x.x is reported
          if [[ "$RESULT" != v24* ]]; then
            echo "ERROR: Expected Node 24.x.x but got: $RESULT"
            exit 1
          fi

      - name: Report image metadata
        run: |
          IMAGE_ID=$(docker image inspect omnistore-node24-ci:${{ github.sha }} --format='{{.ID}}')
          echo "Image ID: $IMAGE_ID"
          echo "Image size: $(docker image inspect omnistore-node24-ci:${{ github.sha }} --format='{{.Size}}') bytes"
          echo "Image architecture: $(docker image inspect omnistore-node24-ci:${{ github.sha }} --format='{{.architecture}}')"
          echo "Image OS: $(docker image inspect omnistore-node24-ci:${{ github.sha }} --format='{{.Os}}')"
