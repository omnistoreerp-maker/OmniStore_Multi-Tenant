name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (node --check, jest, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          node --check server.js
          dirs=""
          for d in config controllers middleware models routes services utils scripts; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          find $dirs -name '*.js' -exec node --check {} +

      - name: Unit tests (fail on failure)
        run: npm test

      - name: Coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright regression (index.html, DigiTronics_v5.html)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright — index.html (fail on failure)
        run: node verify.js index.html 18940

      - name: Playwright — DigiTronics_v5.html (fail on failure)
        run: node verify.js DigiTronics_v5.html 18941

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  marketplace:
    name: Marketplace (tsc, vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build

      # The tracked marketplace/index.html is the PRODUCTION entry served at
      # GET /marketplace/. Fail the build if it references any ./dist asset that
      # the fresh build did not emit (the 200 HTML + 404 JS/CSS blank-page class).
      - name: Entry references only emitted assets
        run: node scripts/verify-entry-assets.mjs

  # License / dependency gate for the Online Games roster. Pure node + git:
  # no install step, so a compromised or half-installed dependency tree can
  # never make this gate pass by accident. Fails the build if a blocked game
  # (survivors, holdtheline, snakesurvivors), a blocked asset byte-hash or an
  # unlicensed Ellaz UI font ever enters the tree.
  online-games-gate:
    name: Online Games license/dependency gate (46 SAFE / 3 BLOCKED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Roster + licence + vendoring-scope gate
        run: node online-games/roster-gate.test.cjs

      # Search, roster contract, the shipped pages, the sandbox/CSP and the
      # no-network promise of the frame. Pure node — no install step either.
      # The checks that need `runtime/dist/` skip here (it is gitignored) and
      # run in full in the online-games-runtime job below, which builds it.
      - name: Section tests (roster, search, surface, runtime)
        run: >
          node --test
          online-games/tests/roster.test.cjs
          online-games/tests/search.test.cjs
          online-games/tests/surface.test.cjs
          online-games/tests/runtime.test.cjs

  # The frame the games origin serves: typecheck it, build it, then run the
  # section tests again with `dist/` on disk so the emitted document, its CSP
  # and its network surface are actually inspected rather than skipped.
  online-games-runtime:
    name: Online Games runtime (tsc, vite build, dist tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online-games/runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: online-games/runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build

      - name: Section tests with dist/ present
        run: >
          node --test
          ../tests/roster.test.cjs
          ../tests/search.test.cjs
          ../tests/surface.test.cjs
          ../tests/runtime.test.cjs
