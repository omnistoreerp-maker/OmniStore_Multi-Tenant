name: Native Build Proof

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: 804272157f556fc5ef5d08b34d77b32ef4159818
          fetch-depth: 0

      - name: Setup Node.js 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Record environment fingerprints
        id: fingerprints
        run: |
          {
            echo "TARGET_SHA=804272157f556fc5ef5d08b34d77b32ef4159818"
            echo "=== Node version ===" && node -v
            echo "=== Node ABI ===" && node -e "console.log('ABI:', process.versions.modules)"
            echo "=== Node arch ===" && node -e "console.log('arch:', process.arch)"
            echo "=== npm version ===" && npm -v
            echo "=== OS release ===" && cat /etc/os-release
            echo "=== Architecture ===" && uname -m
            echo "=== libc ===" && ldd --version 2>/dev/null | head -1 || getconf GNU_LIBC_VERSION
            echo "=== Compiler ===" && gcc --version 2>/dev/null | head -1 || g++ --version 2>/dev/null | head -1
            echo "=== package-lock SHA-256 ===" && sha256sum backend/package-lock.json
          } > env-fingerprints.txt
          cat env-fingerprints.txt

      - name: Install dependencies (full, for testing)
        working-directory: ./backend
        run: npm ci
