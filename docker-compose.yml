# DigiTronics — Docker Compose
# Default: backend only (JSON persistence on a named volume).
#   docker compose up -d
# With nginx reverse proxy + static frontend (requires ./nginx.conf):
#   docker compose --profile nginx up -d
# Environment is read from .env in this directory (see .env.example).

services:
  backend:
    build: ./backend
    image: digitronics-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      BODY_LIMIT: ${BODY_LIMIT:-10mb}
      LOG_FILE: ${LOG_FILE:-}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
