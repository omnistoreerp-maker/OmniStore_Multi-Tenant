<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تراخيص الألعاب | OmniStore Games</title>
<style>
  :root{
    --bg:#070a12; --surface:#0f1420; --surface2:#151c2b; --border:#2a3548;
    --text:#eef2fb; --text2:#aeb9cc; --accent:#5b8def; --accent2:#7aa2ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Cairo',system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:24px 16px 48px;}
  .wrap{max-width:860px;margin:0 auto;}
  h1{font-size:1.5rem;margin-bottom:6px;}
  .sub{color:var(--text2);font-size:.92rem;margin-bottom:22px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:1.05rem;margin-bottom:8px;color:var(--accent2);}
  .card p{font-size:.88rem;color:var(--text2);}
  .card .lic{display:inline-block;margin-top:8px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--accent2);font-weight:700;}
  a{color:var(--accent2);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .back{display:inline-block;margin-bottom:18px;color:var(--accent2);font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/online-games.html">← العودة إلى الألعاب</a>
  <h1>تراخيص الألعاب والإسناد</h1>
  <p class="sub">جميع الألعاب في OmniStore Games مفتوحة المصدر وتُستخدم وفق تراخيصها. هذه الصفحة جزء من التزامنا بمتطلبات الإسناد.</p>
  <div id="list">…</div>
</div>
<script>
(function(){
  'use strict';
  fetch('/games/registry.json')
    .then(function(r){ return r.json(); })
    .then(function(reg){
      var el = document.getElementById('list');
      el.innerHTML = reg.games.filter(function(g){ return g.published; }).map(function(g){
        return '<div class="card">'
          + '<h2>' + g.title + '</h2>'
          + '<p>' + (g.attribution || '') + '</p>'
          + '<p><a href="' + g.source + '" target="_blank" rel="noopener noreferrer">' + g.source + '</a></p>'
          + '<span class="lic">' + g.license + '</span>'
          + '</div>';
      }).join('');
    })
    .catch(function(){
      document.getElementById('list').textContent = 'تعذر تحميل قائمة التراخيص.';
    });
})();
</script>
</body>
</html>
