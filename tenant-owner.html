<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رئيس المالك — متجر omni</title>
<link rel="stylesheet" href="platform/tenant-owner.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">◈</span>
    <span class="name">متجر omni</span>
  </div>
  <div class="tenant-context" id="tenantContext">
    <span class="label">الشركة:</span>
    <span class="value" id="tenantName">—</span>
  </div>
  <div class="user-area">
    <span class="welcome" id="userWelcome">مرحباً، صاحب العمل</span>
    <button class="btn-logout" id="logoutBtn">تسجيل خروج</button>
  </div>
</header>

<main class="container">
  <!-- Business context bar -->
  <div class="context-bar" id="contextBar" style="display:none">
    <span class="ctx-item"><strong>الدور:</strong> <span id="ctxRole">—</span></span>
    <span class="ctx-item"><strong>الصلاحيات:</strong> <span id="ctxPerms">—</span></span>
    <span class="ctx-item"><strong>الحالة:</strong> <span id="ctxStatus">موثقة من الخادم</span></span>
  </div>

  <!-- Page status: loading / error / empty -->
  <div id="pageStatus" class="page-status hidden"></div>

  <!-- Hero: business overview -->
  <section class="hero-section">
    <h1 class="section-title">نظرة عامة على العمل</h1>
    <div class="kpi-grid" id="kpiGrid">
      <!-- KPI cards injected by JS -->
    </div>
  </section>

  <!-- Low stock alerts -->
  <section class="card-section">
    <div class="section-header">
      <h2>تنبيهات المخزون المنخفض</h2>
      <a href="#" class="view-all" id="lowStockViewAll" style="display:none">عرض الكل</a>
    </div>
    <div class="alert-list" id="lowStockList">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- Recent business activity -->
  <section class="card-section">
    <div class="section-header">
      <h2>آخر النشاط التجاري</h2>
    </div>
    <div class="activity-list" id="activityList">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- Customers & suppliers -->
  <section class="two-grid">
    <div class="card-section">
      <div class="section-header">
        <h2>آخر العملاء</h2>
      </div>
      <div class="list-compact" id="customerList">
        <!-- injected by JS -->
      </div>
    </div>
    <div class="card-section">
      <div class="section-header">
        <h2>آخر الموردين</h2>
      </div>
      <div class="list-compact" id="supplierList">
        <!-- injected by JS -->
      </div>
    </div>
  </section>

  <!-- Treasury -->
  <section class="card-section">
    <div class="section-header">
      <h2>آخر الحركات المالية</h2>
    </div>
    <div class="list-compact" id="treasuryList">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- Quick access -->
  <section class="card-section">
    <div class="section-header">
      <h2>الوصول السريع</h2>
    </div>
    <div class="quick-grid" id="quickGrid">
      <!-- injected by JS -->
    </div>
  </section>
</main>

<script src="platform/tenant-owner.js"></script>
</body>
</html>
