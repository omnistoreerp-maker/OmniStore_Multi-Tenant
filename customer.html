<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests — OmniStore Platform</title>
  <link rel="stylesheet" href="customer/customer.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h1>My Requests</h1>
      <p class="subtitle">Track your change requests, releases, and verification status</p>
      <div class="build-info" id="build-info"></div>
    </div>
  </header>

  <main class="container">
    <section class="new-request-section">
      <h2>New Request</h2>
      <form id="new-request-form" class="request-form">
        <div class="form-row">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="200" required>
        </div>
        <div class="form-row">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" maxlength="5000" required></textarea>
        </div>
        <div class="form-row-inline">
          <div>
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="BUG">Bug</option>
              <option value="CHANGE">Change</option>
              <option value="FEATURE">Feature</option>
              <option value="FEEDBACK">Feedback</option>
            </select>
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
              <option value="P0">P0 — Critical</option>
              <option value="P1">P1 — High</option>
              <option value="P2" selected>P2 — Medium</option>
              <option value="P3">P3 — Low</option>
            </select>
          </div>
          <div>
            <label for="product">Product</label>
            <select id="product" name="product" required>
              <option value="ERP">ERP</option>
              <option value="MARKETPLACE">Marketplace</option>
              <option value="GAME_HOSTING">Game Hosting</option>
              <option value="PLATFORM">Platform</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary">Submit Request</button>
        <p class="form-message" id="form-message" hidden></p>
      </form>
    </section>

    <section class="requests-section">
      <h2>Previous Requests</h2>
      <div id="requests-historical" class="request-list"></div>
      <p class="empty-state" id="historical-empty" hidden>No previous requests.</p>
    </section>

    <section class="requests-section">
      <h2>Current Requests</h2>
      <div id="requests-current" class="request-list"></div>
      <p class="empty-state" id="current-empty" hidden>No current requests. Submit a new request above.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>OmniStore Platform — Customer Change &amp; Resolution Foundation</p>
  </footer>

  <script src="customer/customer.js"></script>
</body>
</html>
